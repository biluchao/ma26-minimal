mode: live
symbol: BTCUSDT
timeframe: 1h

warmup:
  bars: 35

strategy:
  ma_period: 26
  atr_period: 14
  trend_atr_mult: 0.5
  attach_atr_dist: 0.5
  detach_atr_mult: 0.3
  trailing_atr_mult: 2.0
  tp_atr_mult: 3.0
  stop_atr_mult: 2.0
  max_size_pct: 0.10
  step_size: 0.001
  min_qty: 0.001
  min_notional: 10.0

risk:
  max_position_pct: 0.30
  max_single_loss_pct: 0.01
  max_daily_loss_pct: 0.02
  max_drawdown_pct: 0.08
  max_open_orders: 2
  max_slippage_bps: 30

equity:
  initial_cash: 1000.0

state:
  snapshot_interval_bars: 10
  snapshots_keep: 200

binance:
  api_key: ${BINANCE_API_KEY}
  api_secret: ${BINANCE_API_SECRET}
  base_url: https://api.binance.com
  ws_url: wss://stream.binance.com:9443
  testnet: false
  recv_window_ms: 5000

clock:
  warn_threshold_s: 1.0
  critical_threshold_s: 5.0
  fatal_threshold_s: 30.0
  check_interval_s: 60

