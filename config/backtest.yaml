# ═════════════════════════════════════════════════════════════════════
# MA26-ATR 量化交易系统 · 回测模式配置
# 模式: backtest（不连接任何外部交易所，纯历史数据驱动）
# ═════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────
# 系统模式
# ─────────────────────────────────────────────────────────────────────
system:
  mode: backtest                    # backtest | paper | live
  version: "4.1.0"
  instance_id: "ma26_backtest_01"
  timezone: "UTC"
  start_bar_index: 0
  warmup_bars: 35                   # 预热K线数（MA26需26根 + ATR14需14根，取最大值+缓冲）
  max_bars: 0                      # 0 = 不限制，跑完数据为止
  initial_capital: 10000.0          # 初始权益（USDT）
  base_currency: "USDT"

# ─────────────────────────────────────────────────────────────────────
# 回测引擎
# ─────────────────────────────────────────────────────────────────────
backtest:
  # 数据来源
  data_source: "csv"                # csv | binance_api | synthetic
  data_path: "data/BTCUSDT_1h.csv"  # CSV 格式: timestamp,open,high,low,close,volume
  start_date: "2024-01-01T00:00:00Z"
  end_date: "2024-12-31T23:59:59Z"

  # 执行模拟
  slippage_bps: 3.0                # 滑点（基点，1bp = 0.01%）
  commission_rate: 0.001           # 手续费率（0.1% 挂单 / 0.1% 吃单，取平均值）
  partial_fill: false               # 回测中是否模拟部分成交
  delay_bars: 0                    # 信号延迟多少根K线执行（模拟网络延迟）

  # 数据完整性
  allow_gaps: false                 # 是否允许K线缺失（false=缺失即报错停机）
  strict_order: true                # 是否强制 OnBar 顺序
  future_barrier: true              # 未来函数检测（开启则违规抛异常）

# ─────────────────────────────────────────────────────────────────────
# 策略参数 — M1 StrategyEngine
# ─────────────────────────────────────────────────────────────────────
strategy:
  # 趋势判定（方向机）
  ma_period: 26                    # MA26
  direction:
    bull_threshold_bars: 3         # 连续3根站上MA → 转BULL
    bear_threshold_bars: 3         # 连续3根跌破MA → 转BEAR
    neutral_buffer_bars: 1         # 缓冲：先回到中性再切换

  # 入场检测带
  detection_band:
    multiplier: 0.5                # ±0.5 ATR14
    mode: "fixed"                  # fixed | adaptive

  # 贴线脱离确认
  breakout:
    min_distance_atr: 0.3          # 脱离MA至少 0.3 ATR 才触发
    confirmation_bars: 1           # 确认K线数
    close_based: true              # true=用收盘价判断, false=用最高/最低价

  # 信号仲裁
  arbitrator:
    dedup_window_bars: 3           # 同一信号抑制窗口
    priority: "STOP_FIRST"         # STOP_FIRST | TP_FIRST | WORST_PRICE
    max_signals_per_bar: 2         # 每根K线最多产生几个信号

  # 加仓
  pyramiding:
    enabled: true
    max_entries: 3                 # 最多加仓次数
    scale_in_ratio: 0.5            # 每次加仓比例（0.5 = 半仓）
    move_stop_to_breakeven: true   # 加仓后止损移到成本线

# ─────────────────────────────────────────────────────────────────────
# 指标参数
# ─────────────────────────────────────────────────────────────────────
indicators:
  ma26:
    period: 26
    type: "SMA"                    # SMA | EMA
  atr:
    period: 14
    smoothing: "Wilder"            # Wilder | SMA | EMA
  rsi:
    period: 14
    overbought: 70
    oversold: 30

# ─────────────────────────────────────────────────────────────────────
# 风控参数 — M4 RiskGuard
# ─────────────────────────────────────────────────────────────────────
risk:
  # 单笔风险
  max_single_loss_pct: 0.02        # 单笔最大亏损 2%
  max_position_qty: 1.0            # 单标的最大持仓量（BTC）
  max_position_notional: 5000.0    # 单标的最大名义额（USDT）
  max_total_exposure_pct: 0.8      # 总仓位不超过权益的 80%

  # 止损
  stop_loss:
    atr_multiplier: 2.0            # 止损 = 入场价 ± 2 ATR
    max_slippage_bps: 50           # 止损最大滑点 50bp（0.5%）
    degrade_to_limit: true         # 滑点超限时降级为LIMIT单
    limit_buffer_bps: 25           # LIMIT单缓冲
    retry_count: 3

  # 止盈
  take_profit:
    atr_multiplier: 3.0            # 止盈 = 入场价 ± 3 ATR
    trailing:
      enabled: true
      activation_atr: 1.5          # 盈利 1.5 ATR 后启动追踪
      trailing_atr: 2.0            # 追踪止损距离 2 ATR

  # 日级风控
  daily:
    max_loss_pct: 0.05             # 日亏上限 5%（触发熔断）
    max_trades: 10                 # 每日最大交易次数
    cooldown_after_loss_pct: 0.03  # 单日亏损达 3% 进入冷却

  # 冷却
  cooldown:
    duration_bars: 10              # 冷却持续K线数
    resume_conditions:
      - "no_open_orders"
      - "position_reconciled"
      - "data_complete_10_bars"
      - "network_connected"
      - "clock_skew_ok"
      - "risk_metrics_normal"

# ─────────────────────────────────────────────────────────────────────
# 仓位管理 — M5 PositionManager
# ─────────────────────────────────────────────────────────────────────
position:
  sizing:
    method: "fixed_fractional"     # fixed_fractional | kelly | volatility_target
    risk_fraction: 0.02            # 每笔风险 = 权益 × 2%
    min_order_qty: 0.001           # 最小下单量
    qty_precision: 3               # 数量小数位（BTC）
    price_precision: 2             # 价格小数位

# ─────────────────────────────────────────────────────────────────────
# 快照与持久化 — M12 Snapshot
# ─────────────────────────────────────────────────────────────────────
snapshot:
  enabled: true
  interval_bars: 100               # 每100根K线存一次快照
  directory: "snapshots"
  format: "json"                   # json | msgpack
  atomic_write: true               # 原子写入（写临时文件+rename）
  fsync: true
  max_keep: 100                    # 保留最近100个快照
  compress: false

# ─────────────────────────────────────────────────────────────────────
# 追踪器 — M13 SignalTracker
# ─────────────────────────────────────────────────────────────────────
tracker:
  dedup:
    window_bars: 3
    per_symbol: true
    per_source: true
  trace:
    enabled: true
    propagate: true                # 跨模块传递 trace_id

# ─────────────────────────────────────────────────────────────────────
# 绩效分析 — M11 Performance
# ─────────────────────────────────────────────────────────────────────
performance:
  report:
    output: "reports/backtest_report.json"
    include_trades: true
    include_equity_curve: true
    include_drawdown_curve: true
  metrics:
    benchmark: "buy_and_hold"      # 对比基准
    risk_free_rate: 0.0

# ─────────────────────────────────────────────────────────────────────
# 事件总线
# ─────────────────────────────────────────────────────────────────────
event_bus:
  persist_event_types:
    - "signal.generated"
    - "order.filled"
    - "risk.cooling_triggered"
    - "trade.closed"
    - "error.occurred"
  persist_queue_size: 10000
  async_dispatch: false            # 回测中同步分发（保证确定性和可重放）

# ─────────────────────────────────────────────────────────────────────
# 日志
# ─────────────────────────────────────────────────────────────────────
logging:
  level: "INFO"                    # DEBUG | INFO | WARN | ERROR
  file: "logs/backtest.log"
  max_file_size_mb: 50
  max_files: 5
  sanitize_sensitive: true         # 脱敏（回测中非必需但保持一致性）

# ─────────────────────────────────────────────────────────────────────
# 文件治理
# ─────────────────────────────────────────────────────────────────────
file_governance:
  enforce_schema_version: true
  checksums: true
  orphan_detection: true
  lifecycle:
    snapshots: 100                 # 保留100个
    audit_logs_days: 30
    signal_records_days: 7
    temp_files_timeout_min: 5

