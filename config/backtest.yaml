# config/backtest.yaml
# MA26-ATR 量化交易系统 v4.1.0-minimal — 回测专用配置
#
# 说明:
#   此配置用于完整回测验证，参数经过保守调优。
#   特点：较小资金、严格风控、震荡市数据，便于验证系统鲁棒性。
#
# 使用方式:
#   python bootstrap.py --mode backtest --config config/backtest.yaml

# ═══════════════════════════════════════════════════════════════
# 系统全局
# ═══════════════════════════════════════════════════════════════
initial_equity: 50000.0
snapshot_dir: ./snapshots/backtest

# ═══════════════════════════════════════════════════════════════
# K线模块 (M03_Kline)
# ═══════════════════════════════════════════════════════════════
kline:
  max_bars: 300

# ═══════════════════════════════════════════════════════════════
# 策略模块 (M01_Strategy)
# 保守震荡策略：较高阈值 + 较宽检测带
# ═══════════════════════════════════════════════════════════════
strategy:
  ma_period: 26
  atr_period: 14
  band_multiplier: 0.8          # 较宽检测带 (±0.8×ATR)，减少假信号
  detach_multiplier: 0.5        # 较强脱离判定 (≥0.5×ATR)
  min_trend_strength: 0.7       # 较高趋势强度要求 (0.7)

# ═══════════════════════════════════════════════════════════════
# 风控模块 (M04_Risk)
# 严格风控：日亏3% / 单笔1.5% / 回撤15%
# ═══════════════════════════════════════════════════════════════
risk:
  max_daily_loss_pct: 0.03
  max_single_loss_pct: 0.015
  max_drawdown_pct: 0.15
  max_slippage_bps: 30
  max_position_value_usdt: 5000.0
  kill_switch_enabled: true

# ═══════════════════════════════════════════════════════════════
# 回测数据：震荡市 (均值回归)
# 使用较大振幅测试策略在震荡行情下的表现
# ═══════════════════════════════════════════════════════════════
data_source: generated
n_bars: 200
start_price: 45000.0
seed: 2024
market_type: ranging
amplitude: 0.015
