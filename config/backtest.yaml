# config/backtest.yaml
# 回测专用配置 — 继承 default 并覆盖回测相关参数

# 继承 default.yaml 的基础参数，以下为回测覆盖项

initial_equity: 50000.0        # 较小初始资金测试

strategy:
  ma_period: 26
  atr_period: 14
  band_multiplier: 0.5
  detach_multiplier: 0.3
  min_trend_strength: 0.55     # 略降低阈值以增加信号频率

risk:
  max_daily_loss_pct: 0.03     # 更严格的日亏限制 (3%)
  max_single_loss_pct: 0.015
  max_drawdown_pct: 0.15
  max_slippage_bps: 30
  max_position_value_usdt: 5000.0
  kill_switch_enabled: true

# 回测数据：震荡市
data_source: generated
n_bars: 200
start_price: 45000.0
seed: 2024
market_type: ranging
amplitude: 0.015

kline:
  max_bars: 300

snapshot_dir: ./snapshots/backtest
